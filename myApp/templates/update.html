{% extends 'base.html' %}
{% block title %}Update | DjangoApp{% endblock %}
{% block content %}
<h2>Update Person Details</h2>
<form method="POST">
    {% csrf_token %}
    <label>First Name:</label>
    <input type="text" name="fName" value="{{ persons.first_name }}" required><br><br>
    
    <label>Last Name:</label>
    <input type="text" name="lName" value="{{ persons.last_name }}" required><br><br>
    
    <label>Age:</label>
    <input type="number" name="age" value="{{ persons.age }}" required><br><br>
    
    <label>City:</label>
    <input type="text" name="city" value="{{ persons.city }}" required><br><br>
    
    <label>Email:</label>
    <input type="email" name="email" value="{{ persons.email }}" required><br><br>
    
    <button type="submit" class="p-3 bg-primary text-light">Update</button>
</form>
{% endblock %}
